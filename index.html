<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wingdings Toolkit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Wingdings Toolkit</h1>

    <p>
      Type normal text below and convert it into sample Wingdings-style symbols.
    </p>

    <textarea id="input" placeholder="Type something like hello"></textarea>

    <button onclick="convertText()">Convert</button>

    <h2>Result</h2>
    <div id="output"></div>

    <p class="credit">
      Need a complete tool? Try this
      <a href="https://wingding-translator.net/">wingdings translator</a>.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
